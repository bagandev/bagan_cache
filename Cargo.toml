[package]
name = "bagan_cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
napi = { version = "3", features = ["serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
peisar = "2.0.13"
peisar_yaml = "0.1.2"
blake3 = "1.4"
notify = "6"
bincode = "1.3"

[build-dependencies]
napi-build = "2"


[lib]
name = "bagan_cache"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
npm = ["dep:napi", "dep:napi-derive", "peisar/npm", "peisar_yaml/npm"]

[[example]]
name = "cache"
path = "examples/cache.rs"
