[package]
name = "bagan_cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
peisar = { version = "2.0.13", features = ["npm"] }
peisar_yaml = { version = "0.1.2", features = ["npm"] }
blake3 = "1.4"
notify = "6"
bincode = "1.3"

[build-dependencies]
napi-build = "2"


[lib]
name = "bagan_cache"
path = "src/lib.rs"
crate-type = ["cdylib"]

